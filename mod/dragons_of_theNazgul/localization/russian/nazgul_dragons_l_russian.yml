l_russian:
 # Драконы (ключи = dragon_type + имена особей)
 nazgul_dragon_fell_beast.1.name: "Падаль-зверь Чёрного Всадника"
 nazgul_dragon_fell_beast.2.name: "Назгульский падаль-зверь"
 nazgul_dragon_fell_beast.3.name: "Падаль-зверь, Бич Гондора"
