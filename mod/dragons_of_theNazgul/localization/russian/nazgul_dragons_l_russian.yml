l_russian:
 trait_nazgul_fell_beast_rider: "Наездник падаль-зверя"
 trait_nazgul_fell_beast_rider_desc: "Этот назгул повелевает одним из крылатых ужасов, служащих Саурону, и седлает его, как драконы древности."
 nazgul_fell_beast_rider_tt: "Пока привязан зверь: +скорость передвижения и страха."
 trait_nazgul_fell_beast_master: "Повелитель падаль-зверей"
 trait_nazgul_fell_beast_master_desc: "Зверь этого наездника пал, но тёмное искусство укрощения крылатых тварей осталось при нём."
 trait_master_of_fell_beasts: "Страж крылатых ужасов"
 trait_master_of_fell_beasts_desc: "Падаль-звери слушаются этого всадника так же, как когда-то слушали своего господина из Минас-Моргула."
 trait_nazgul_dragon: "Падаль-зверь"
 trait_nazgul_dragon_tt: "Крылатое создание тени, старше самого Средиземья."
 trait_nazgul_dragon_desc: "Крылатый ужас древнего мира — огромный, смертоносный и связанный с хозяином тёмной магией."
 trait_nazgul_dragon_bloodthirsty: "Жаждущий крови зверь"
 trait_nazgul_dragon_physique_good_3: "Огромный падаль-зверь"
 trait_nazgul_dragon_swift: "Ездок ветра"
 trait_nazgul_fell_beast: "Падаль-зверь"
 trait_nazgul_lord_of_angermont: "Владыка Ангормаунта"
 trait_nazgul_lord_of_angermont_desc: "Величайший из падаль-зверей, прародитель крылатых теней Ангмара."
 decision_category_nazgul_fell_beasts_title: "Падаль-звери Назгул"
 decision_category_nazgul_fell_beasts_desc: "Решения для Кольценосцев: призывать и седлать крылатых ужасов Мордора."
 decision_nazgul_claim_fell_beast.0.name: "Оседлать падаль-зверя"
 decision_nazgul_claim_fell_beast.0.desc: "Отправьте варгов и слуг в горы Ангмара и Долину Моргула, чтобы поймать одного из летающих демонов, служащих Девяти. Лишь назгул способен совладать с таким зверем."
 decision_nazgul_mount_fell_beast.0.name: "Взлететь на крыльях ужаса"
 decision_nazgul_mount_fell_beast.0.desc: "Садитесь на зверя и поднимитесь в чёрное небо. Ужас пойдёт впереди вас."
 nazgul_fellbeast.0001.t: "Призыв падаль-зверей"
 nazgul_fellbeast.0001.d: "Со скал Ангмара и из глубин долины Моргула крылатые тени являются на ваш зов."
 nazgul_fellbeast.0002.t: "Пал падаль-зверь"
 nazgul_fellbeast.0002.d: "Один из ваших драгоценных ездовых зверей лежит мёртвым на поле боя. Его крик всё ещё звучит в памяти."
 nazgul_fellbeast.0003.t: "Дар Саурона"
 nazgul_fellbeast.0003.d: "Тёмный Владыка даровал вам зверя, достойного вашего звания."
 nazgul_bind_fell_beast_tt: "Зверь связан с хозяином тёмной магией."
 nazgul_fell_beast_flight_tt: "Полёт назгула: +150% скорость странствий, +200 безопасность на год."
 nazgul_fell_beast_log_claims: "$TRAIT$ призывает падаль-зверя"
 nazgul_fell_beast_flavor.1: "Крылатый ужас"
 nazgul_fell_beast_flavor.3: "Его крик пронзает сердце, как клинок"
 trigger_only_nazgul_can_ride_desc: "Лишь назгул (или отмеченный традицией падаль-зверей) может летать верхом на этих тварях."
