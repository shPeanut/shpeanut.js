l_english:
 # Traits
 trait_nazgul_fell_beast_rider: "Fell Beast Rider"
 trait_nazgul_fell_beast_rider_desc: "This Ringwraith commands one of the winged horrors that serve Sauron, mounting it as a dragon of old."
 nazgul_fell_beast_rider_tt: "Gains travel speed and dread while mounted upon a fell beast."
 trait_nazgul_fell_beast_master: "Master of Fell Beasts"
 trait_nazgul_fell_beast_master_desc: "This rider's mount has fallen, but the dark arts of breaking winged beasts remain."
 trait_master_of_fell_beasts: "Warden of Winged Horrors"
 trait_master_of_fell_beasts_desc: "The fell beasts obey this rider as they once obeyed their lord of Minas Morgul."
 trait_nazgul_dragon: "Fell Beast"
 trait_nazgul_dragon_tt: "A wingèd creature of shadow, older than Middle-earth itself."
 trait_nazgul_dragon_desc: "A wingèd horror of the ancient world — huge, lethal, and bound to its rider by dark sorcery."
 trait_nazgul_dragon_bloodthirsty: "Bloodthirsty Mount"
 trait_nazgul_dragon_bloodthirsty_desc: "This beast hungers for flesh and fear alike."
 trait_nazgul_dragon_physique_good_3: "Vast Fell Beast"
 trait_nazgul_dragon_physique_good_3_desc: "So vast that its shadow blots out the sun over a battlefield."
 trait_nazgul_dragon_swift: "Wind-Rider"
 trait_nazgul_dragon_swift_desc: "Few arrows can touch this beast in the black sky."
 trait_nazgul_fell_beast: "Fell Beast"
 trait_nazgul_fell_beast_desc: "A wingèd horror of the ancient world."
 trait_nazgul_lord_of_angermont: "Lord of Angermount"
 trait_nazgul_lord_of_angermont_desc: "The greatest of all fell beasts, sire of the wingèd shadows of Angmar."

 # Decisions
 decision_category_nazgul_fell_beasts_title: "Fell Beasts of the Nazgûl"
 decision_category_nazgul_fell_beasts_desc: "Decisions for the Ringwraiths to claim and ride the winged horrors of Mordor."
 decision_nazgul_claim_fell_beast.0.name: "Saddle a Fell Beast"
 decision_nazgul_claim_fell_beast.0.desc: "Send wargs and servants into the mountains of Angmar and Morgul Vale to capture one of the flying demons that serve the Nine. Only a Ringwraith may master such a beast."
 decision_nazgul_mount_fell_beast.0.name: "Take Flight Upon Fell Wings"
 decision_nazgul_mount_fell_beast.0.desc: "Mount your fell beast and rise into the black sky. Terror shall go before you."

 # Events
 nazgul_fellbeast.0001.t: "The Summoning of the Fell Beasts"
 nazgul_fellbeast.0001.d: "From the cliffs of Angmar and the deeps of Morgul Vale, the winged shadows come at your call."
 nazgul_fellbeast.0002.t: "A Fell Beast Has Fallen"
 nazgul_fellbeast.0002.d: "One of your precious mounts lies dead upon the battlefield. Its shriek still echoes in your memory."
 nazgul_fellbeast.0003.t: "A Gift from Sauron"
 nazgul_fellbeast.0003.d: "The Dark Lord has granted you a mount worthy of your station."

 # Tooltips / flavor
 nazgul_bind_fell_beast_tt: "The beast is bound to its rider by dark sorcery."
 nazgul_fell_beast_flight_tt: "Flight of the Nazgûl: +150% travel speed, +200 safety for one year."
 nazgul_fell_beast_log_claims: "$TRAIT$ claims a fell beast"
 nazgul_fell_beast_flavor.1: "The Wingèd Terror"
 nazgul_fell_beast_flavor.2: "Feared Even by the Great Eagles"
 nazgul_fell_beast_flavor.3: "Its cry pierces the heart like a blade"
 trigger_only_nazgul_can_ride_desc: "Only a Ringwraith (or one marked with the fell-beast tradition) may ride these horrors."
 nazgul_has_bound_fell_beast_tt: "Has a living fell beast bound as a mount."
